[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-coreml"
version = "0.1.0"
description = "Experimental Core ML runtime and reproducible conversion for Laya decision models"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["coremltools>=9,<10", "numpy>=1.26,<2.2", "tokenizers>=0.21,<1", "huggingface-hub>=0.34,<2"]

[project.optional-dependencies]
convert = ["torch==2.7.0", "safetensors>=0.6"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1", "psutil>=6"]
compare = ["laya-mlx==0.1.0"]
research = ["kmeans1d==0.4.0"]

[project.scripts]
laya-coreml = "laya_coreml.cli:main"

[project.urls]
Repository = "https://github.com/mizorewww/laya-coreml"
Upstream = "https://github.com/NandhaKishorM/laya"

[tool.hatch.build.targets.wheel]
packages = ["laya_coreml"]

[tool.hatch.build.targets.sdist]
include = ["/laya_coreml", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
